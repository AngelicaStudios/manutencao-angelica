<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Manutenção">
<meta name="theme-color" content="#16a34a">
<link rel="manifest" href="manifest-equipe.json">
<link rel="apple-touch-icon" href="icon-equipe-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-equipe-192.png">
<title>Manutenção — Equipe</title>
<style>
  :root {
    --green:   #16a34a;
    --green-d: #15803d;
    --blue:    #2563eb;
    --yellow:  #d97706;
    --red:     #dc2626;
    --bg:      #f0f2f5;
    --card:    #ffffff;
    --text:    #1e293b;
    --muted:   #64748b;
    --border:  #e2e8f0;
    --radius:  14px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
  }

  /* ═══════════════════════════
     TELA DE LOGIN
  ═══════════════════════════ */
  #login-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 20px;
    background: linear-gradient(160deg, #14532d 0%, #16a34a 100%);
  }
  .login-logo   { font-size: 4rem; margin-bottom: 8px; }
  .login-title  { color: #fff; font-size: 1.5rem; font-weight: 800; margin-bottom: 4px; text-align: center; }
  .login-sub    { color: rgba(255,255,255,.75); font-size: .9rem; margin-bottom: 36px; text-align: center; }

  .login-box {
    background: #fff;
    border-radius: 20px;
    padding: 28px 24px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 16px 48px rgba(0,0,0,.25);
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: center;
    text-align: center;
  }
  .login-box h2 { font-size: 1.15rem; font-weight: 700; }
  .login-box p  { font-size: .85rem; color: var(--muted); line-height: 1.5; }

  .btn-enter {
    width: 100%;
    padding: 16px;
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    transition: background .2s;
    margin-top: 6px;
  }
  .btn-enter:active { background: var(--green-d); transform: scale(.98); }

  /* ═══════════════════════════
     HEADER
  ═══════════════════════════ */
  #app { display: none; min-height: 100vh; flex-direction: column; }
  #app.visible { display: flex; }

  header {
    background: var(--green);
    color: #fff;
    padding: 14px 16px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,.2);
  }
  .header-left  h1    { font-size: 1rem; font-weight: 800; }
  .header-left  span  { font-size: .72rem; opacity: .8; }
  .logout-btn {
    background: rgba(255,255,255,.2);
    border: 1.5px solid rgba(255,255,255,.5);
    color: #fff;
    border-radius: 20px;
    padding: 6px 14px;
    font-size: .78rem;
    font-weight: 700;
    cursor: pointer;
  }

  /* ═══════════════════════════
     CONTADORES = FILTROS
     Os números viram os próprios botões de filtro: um toque só, sem uma segunda
     barra de opções embaixo. Some também o seletor de data — a tela já abre no
     dia de hoje (e mantém o que ficou atrasado), então não há o que escolher.
  ═══════════════════════════ */
  .counters-bar {
    display: flex;
    gap: 8px;
    background: #fff;
    border-bottom: 1.5px solid var(--border);
    padding: 10px;
  }
  .cnt {
    flex: 1;
    text-align: center;
    padding: 9px 2px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: #fff;
    font-family: inherit;
    cursor: pointer;
    transition: all .15s;
  }
  .cnt:active { transform: scale(.97); }
  .cnt .num { font-size: 1.35rem; font-weight: 800; line-height: 1; }
  .cnt .lbl { font-size: .58rem; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; margin-top: 3px; }
  .cnt.c-pend  .num { color: var(--yellow); }
  .cnt.c-and   .num { color: var(--blue);   }
  .cnt.c-conc  .num { color: var(--green);  }
  .cnt.c-total .num { color: var(--text);   }

  /* filtro ativo: fundo suave na cor do próprio status */
  .cnt.on              { border-width: 2px; }
  .cnt.c-total.on      { background: #f1f5f9; border-color: #64748b; }
  .cnt.c-pend.on       { background: #fef9c3; border-color: var(--yellow); }
  .cnt.c-and.on        { background: #dbeafe; border-color: var(--blue); }
  .cnt.c-conc.on       { background: #dcfce7; border-color: var(--green); }
  .cnt.on .lbl         { color: var(--text); font-weight: 700; }

  /* ═══════════════════════════
     LISTA DE TAREFAS
  ═══════════════════════════ */
  #task-list {
    flex: 1;
    padding: 14px 12px calc(14px + var(--safe-bottom));
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .task-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    border-left: 5px solid var(--border);
    overflow: hidden;
  }
  .task-card[data-prio="alta"]  { border-left-color: var(--red);    }
  .task-card[data-prio="media"] { border-left-color: var(--yellow);  }
  .task-card[data-prio="baixa"] { border-left-color: var(--green);   }

  .card-top {
    padding: 14px 14px 10px;
  }
  .card-row1 {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }
  .card-tipo  { font-size: 1rem; font-weight: 800; flex: 1; }
  .card-date  { font-size: .72rem; font-weight: 600; white-space: nowrap; }
  .date-hoje     { color: var(--blue); }
  .date-atrasada { color: var(--red);  }
  .date-futura   { color: var(--muted); }

  .card-tags  { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }

  .tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: .68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .3px;
  }
  .tag-apto     { background: #ede9fe; color: #5b21b6; }
  .tag-resp     { background: #e0f2fe; color: #075985; }
  .tag-pend     { background: #fef3c7; color: #92400e; }
  .tag-and      { background: #dbeafe; color: #1e40af; }
  .tag-conc     { background: #dcfce7; color: #166534; }

  .card-desc  { font-size: .83rem; color: var(--muted); line-height: 1.4; }

  .card-obs-saved {
    margin: 6px 14px 0;
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: .8rem;
    color: var(--text);
  }
  .card-obs-saved strong { color: var(--blue); }

  .card-exec-date {
    margin: 6px 14px 0;
    font-size: .78rem;
    color: var(--green);
    font-weight: 600;
  }

  /* Fotos salvas */
  .card-fotos {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 8px 14px 0;
  }
  .card-foto-thumb {
    width: 68px; height: 68px;
    object-fit: cover;
    border-radius: 8px;
    border: 2px solid var(--border);
  }

  /* ═══════════════════════════
     PAINEL DE AÇÃO
  ═══════════════════════════ */
  .action-toggle {
    width: 100%;
    background: none;
    border: none;
    border-top: 1.5px solid var(--border);
    padding: 13px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: .85rem;
    font-weight: 700;
    color: var(--blue);
    cursor: pointer;
    margin-top: 10px;
  }
  .action-toggle .arrow { transition: transform .2s; }
  .action-toggle.open .arrow { transform: rotate(180deg); }

  .action-panel {
    display: none;
    flex-direction: column;
    gap: 14px;
    padding: 14px;
    border-top: 1px solid var(--border);
    background: #f8fafc;
  }
  .action-panel.open { display: flex; }

  /* STATUS BUTTONS */
  .status-btns {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .status-btn {
    padding: 12px 6px;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: #fff;
    font-size: .75rem;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    line-height: 1.3;
    transition: all .15s;
    color: var(--muted);
  }
  .status-btn:active { transform: scale(.96); }
  .status-btn .s-icon { font-size: 1.4rem; display: block; margin-bottom: 3px; }
  .status-btn.active-pend { background: #fef9c3; border-color: var(--yellow); color: #92400e; }
  .status-btn.active-and  { background: #dbeafe; border-color: var(--blue);   color: #1e40af; }
  .status-btn.active-conc { background: #dcfce7; border-color: var(--green);  color: #166534; }

  /* DATA EXECUÇÃO */
  .field-label {
    font-size: .72rem;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .4px;
    margin-bottom: 5px;
  }
  .field-input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: .9rem;
    font-family: inherit;
    background: #fff;
    color: var(--text);
  }
  .field-input:focus { outline: none; border-color: var(--green); }

  textarea.field-input { min-height: 80px; resize: none; }

  /* FOTO */
  .foto-label {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #fff;
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 14px;
    cursor: pointer;
    font-size: .88rem;
    font-weight: 600;
    color: var(--muted);
    transition: border-color .2s;
  }
  .foto-label:active { border-color: var(--green); }
  .foto-label .cam-icon { font-size: 1.6rem; }
  input[type="file"] { display: none; }

  .fotos-preview {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .prev-wrap { position: relative; }
  .prev-thumb {
    width: 72px; height: 72px;
    object-fit: cover;
    border-radius: 8px;
    border: 2px solid var(--border);
  }
  .prev-del {
    position: absolute;
    top: -6px; right: -6px;
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 20px; height: 20px;
    font-size: .7rem;
    font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  /* BOTÃO SALVAR */
  .btn-save {
    width: 100%;
    padding: 16px;
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    transition: background .2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-save:active { background: var(--green-d); transform: scale(.98); }

  /* ═══════════════════════════
     VAZIO
  ═══════════════════════════ */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty .icon { font-size: 3.5rem; margin-bottom: 12px; }
  .empty p     { font-size: .92rem; }

  /* ═══════════════════════════
     LIGHTBOX
  ═══════════════════════════ */
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.92);
    z-index: 500;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 20px;
  }
  #lightbox.open { display: flex; }
  #lightbox img  { max-width: 100%; max-height: 75vh; border-radius: 10px; object-fit: contain; }
  #lightbox button {
    background: #fff; border: none; border-radius: 8px;
    padding: 10px 28px; font-size: .9rem; font-weight: 700; cursor: pointer;
  }

  /* ═══════════════════════════
     BOTÃO INSTALAR
  ═══════════════════════════ */
  #btn-instalar {
    display: none;            /* só aparece se o navegador oferecer a instalação */
    width: 100%;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px;
    border: none;
    background: #1e293b;
    color: #fff;
    font-family: inherit;
    font-size: .85rem;
    font-weight: 700;
    cursor: pointer;
  }
  #btn-instalar:active { background: #0f172a; }

  /* ═══════════════════════════
     NAV (Tarefas / Meu Dia)
  ═══════════════════════════ */
  /* Abas como botões: contorno visível e fundo suave no ativo, para ficar claro
     que dá para tocar — a barrinha embaixo sozinha não passava isso. */
  nav.tabs {
    display: flex;
    gap: 8px;
    background: #fff;
    border-bottom: 1.5px solid var(--border);
    padding: 10px;
    position: sticky;
    top: 57px;
    z-index: 99;
  }
  nav.tabs button {
    flex: 1;
    padding: 12px 6px;
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 22px;
    font-family: inherit;
    font-size: .85rem;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    position: relative;
    transition: all .15s;
  }
  nav.tabs button:active { transform: scale(.97); }
  nav.tabs button.active {
    color: #166534;
    background: #dcfce7;
    border-color: var(--green);
    border-width: 2px;
  }
  .nav-badge {
    display: none;
    background: var(--red);
    color: #fff;
    border-radius: 20px;
    font-size: .62rem;
    font-weight: 800;
    padding: 1px 7px;
    margin-left: 4px;
    vertical-align: middle;
  }
  .nav-badge.on { display: inline-block; }

  .view { display: none; flex: 1; flex-direction: column; }
  .view.active { display: flex; }

  /* ═══════════════════════════
     MEU DIA
  ═══════════════════════════ */
  #meudia { padding: 14px 12px calc(24px + var(--safe-bottom)); gap: 12px; }

  .md-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    padding: 14px;
  }
  .md-trava {
    background: #fef2f2;
    border: 1.5px solid #fecaca;
    color: #991b1b;
    border-radius: var(--radius);
    padding: 14px;
    font-size: .85rem;
    font-weight: 700;
    line-height: 1.5;
  }
  .md-trava .lista { font-weight: 600; margin-top: 6px; font-size: .82rem; }
  .md-ok {
    background: #dcfce7;
    border: 1.5px solid #bbf7d0;
    color: #166534;
    border-radius: var(--radius);
    padding: 12px 14px;
    font-size: .85rem;
    font-weight: 700;
    text-align: center;
  }
  .md-data {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 4px;
  }
  .md-data h3 { font-size: 1rem; font-weight: 800; }
  .md-data .sub { font-size: .72rem; color: var(--muted); font-weight: 600; }

  .turno-box { border: 1.5px solid var(--border); border-radius: 12px; padding: 12px; }
  .turno-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .turno-head strong { font-size: .95rem; }
  .turno-head small  { font-size: .72rem; color: var(--muted); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 10px 14px;
    border: 2px solid var(--border);
    border-radius: 22px;
    background: #fff;
    font-size: .82rem;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    font-family: inherit;
  }
  .chip:active { transform: scale(.97); }
  .chip.on       { background: #dcfce7; border-color: var(--green); color: #166534; }
  .chip.on-cinza { background: #e2e8f0; border-color: #94a3b8; color: #334155; }
  .chip.on-esc   { background: #334155; border-color: #334155; color: #fff; }

  .ext-box { margin-top: 10px; display: none; gap: 8px; }
  .ext-box.open { display: flex; }
  .ext-box input {
    padding: 11px 12px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: .88rem;
    font-family: inherit;
    color: var(--text);
    background: #fff;
    min-width: 0;
  }
  .ext-box input.h { width: 82px; text-align: right; flex-shrink: 0; }
  .ext-box input.d { flex: 1; }

  .resumo-turno { margin-top: 10px; font-size: .76rem; color: var(--muted); line-height: 1.5; }
  .resumo-turno b { color: var(--text); }
  .resumo-turno .erro { color: var(--red); font-weight: 700; }

  .md-hist { font-size: .78rem; }
  .md-hist-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border);
  }
  .md-hist-row:last-child { border-bottom: none; }
  .md-hist-row .dt { font-weight: 700; white-space: nowrap; }
  .md-hist-row .de { color: var(--muted); text-align: right; line-height: 1.4; }

  /* ═══════════════════════════
     TOAST
  ═══════════════════════════ */
  #toast {
    position: fixed;
    bottom: calc(20px + var(--safe-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1e293b;
    color: #fff;
    padding: 12px 22px;
    border-radius: 24px;
    font-size: .88rem;
    font-weight: 700;
    box-shadow: 0 4px 20px rgba(0,0,0,.3);
    opacity: 0;
    transition: all .3s;
    pointer-events: none;
    z-index: 400;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ═══ Padrao visual Angelica Studios — identidade unica ═══════════════════
   Bloco no FIM da folha, senao as regras originais vencem por cascata.

   ATENCAO ao verde deste modulo: diferente dos outros, aqui --green tem DOIS
   papeis — marca (cabecalho, botoes) e STATUS (concluida, prioridade baixa).
   Por isso ele NAO vira apelido do dourado: trocaria a cor de status junto e
   destruiria a leitura. So os usos de marca sao trocados, um a um. */
:root{
  --acento:#8a5f22; --acento-claro:#D9A85C; --acento-d:#6e4b18;
  --acento-bg:#faf4e8; --acento-bg-h:#f2e5cd;
  --azul-info:#2563eb; --azul-esc:#1e293b;
  --bg:#e4e8ee; --radius:10px;
}
body{ background:var(--bg); }

header{ background:var(--azul-esc); padding:0; display:block; }
.cabecalho-int{ padding:13px 16px 11px; display:flex; align-items:center;
  justify-content:space-between; gap:12px; }
header .titulo{ display:flex; flex-direction:column; gap:1px; min-width:0; }
header h1{ font-size:1rem; font-weight:700; line-height:1.2;
  color:var(--acento-claro); letter-spacing:.01em; }
header .sub{ font-size:.7rem; color:#94a3b8; }
.hdr-acoes{ display:flex; align-items:center; gap:10px; flex:0 0 auto; }
#header-user{ font-size:.75rem; font-weight:700; color:#cbd5e1; }
.logout-btn{ border-radius:8px; border:1.5px solid rgba(255,255,255,.4);
  background:rgba(255,255,255,.10); font-size:.78rem; font-weight:600; padding:6px 12px; }

/* Marca: entrar e aba ativa passam pro dourado. Salvar fica verde — e a acao
   que confirma, mesmo criterio do "Enviar" da Cobranca Avulsa. Todos ganham a
   receita de contorno + fundo suave no lugar do solido com texto branco. */
.btn-enter{ background:var(--acento-bg); border:1.5px solid var(--acento);
  color:var(--acento); }
.btn-save{ background:#dcfce7; border:1.5px solid var(--green); color:#166534; }
nav.tabs button.active{ background:var(--acento-bg); border-color:var(--acento);
  color:var(--acento); }

/* ═══ Desktop ══════════════════════════════════════════════════════════════
   Este modulo nao tinha ponto de quebra nenhum: o layout do celular era servido
   igual no monitor, esticando cada card de ponta a ponta. Acima de 900px o
   conteudo passa a viver na coluna de 1600, como nos demais. */
@media (min-width:900px){
  .cabecalho-int{ max-width:1600px; margin:0 auto; padding:14px 24px 12px; }
  .counters-bar{ max-width:1600px; margin:0 auto; padding-left:24px; padding-right:24px; }
  #task-list{ max-width:1600px; margin:0 auto; padding:14px 24px 30px; }
  .view{ max-width:1600px; margin:0 auto; }

}

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</head>
<body>

<!-- ═══════════════════════════════
     LOGIN
═══════════════════════════════ -->
<div id="login-screen">
  <div class="login-logo">🔧</div>
  <div class="login-title">Manutenção</div>

  <div class="login-box">

    </div>

</div>

<!-- ═══════════════════════════════
     APP
═══════════════════════════════ -->
<div id="app">

  <header>
    <div class="cabecalho-int">
      <div class="titulo">

  </header>

  <!-- Instalar na tela inicial (só aparece se o celular oferecer) -->

    <span>Instalar app na tela inicial</span>
  </button>

  <!-- Abas -->

  </nav>

  <!-- ─── VIEW: TAREFAS ─── -->

    <!-- Lista -->

  <!-- ─── VIEW: MEU DIA ─── -->

<!-- Lightbox -->
<div id="lightbox" onclick="closeLightbox()">
  <img id="lb-img" src="" alt="" onclick="event.stopPropagation()" />
  <button onclick="closeLightbox()">Fechar</button>
</div>

<div id="toast"></div>

<script>
// ════════════════════════════════
// ESTADO GLOBAL FIREBASE
// ════════════════════════════════
let tasks        = [];
let currentUser  = '';
let listenersOn  = false;
const fotosPendentes = {};

function initListeners() {
  if (listenersOn) return;
  listenersOn = true;
  db.collection('tarefas').onSnapshot(snap => {
    tasks = snap.docs.map(d => d.data());
    if (currentUser) render();
  });
}

async function dbUpdate(id, fields) {
  await db.collection('tarefas').doc(id).update(fields);
}

// Popula botões de nome no login
function carregarFuncs() {
  db.collection('config').doc('funcionarios').get().then(snap => {
    let lista = [];
    if (snap.exists) {
      const d = snap.data();
      lista = d.funcionarios || (d.nomes ? d.nomes.map(n => ({nome:n, pin:''})) : []);
    }
    const container = document.getElementById('func-btns');
    if (!lista.length) {
      container.innerHTML = `<p style="color:var(--muted);font-size:.85rem;text-align:center">Nenhum funcionário cadastrado.<br>Fale com o gestor.</p>`;
    } else {
      container.innerHTML = lista.map(f =>
        `<button class="btn-enter" onclick="pedirPin('${f.nome.replace(/'/g,"\\'")}')">${f.nome}</button>`
      ).join('');
    }
  }).catch(() => {
    document.getElementById('func-btns').innerHTML =
      `<p style="color:var(--red);font-size:.85rem;text-align:center">Erro de conexão. Verifique a internet.</p>`;
  });
}

function pedirPin(nome) {
  const container = document.getElementById('func-btns');
  container.innerHTML = `
    <div style="text-align:center;font-size:.9rem;font-weight:600;color:var(--text);margin-bottom:4px">${nome}</div>
    <p style="font-size:.78rem;color:var(--muted);text-align:center;margin:0 0 10px">Digite seu PIN de acesso</p>
    <input type="password" id="pin-input" maxlength="8" placeholder="••••"
      style="width:100%;text-align:center;letter-spacing:6px;font-size:1.3rem;padding:12px;
             border:2px solid var(--blue);border-radius:12px;background:#fff;font-family:monospace"
      onkeydown="if(event.key==='Enter')confirmarPin('${nome.replace(/'/g,"\\'")}')" />
    <button class="btn-enter" style="margin-top:10px"
      onclick="confirmarPin('${nome.replace(/'/g,"\\'")}')">Entrar</button>
    <button class="btn-enter"
      style="background:transparent;color:var(--muted);border:1px solid var(--border);margin-top:6px"
      onclick="carregarFuncs()">← Voltar</button>
  `;
  setTimeout(() => document.getElementById('pin-input')?.focus(), 80);
}

function confirmarPin(nome) {
  const pin = (document.getElementById('pin-input')?.value || '').trim();
  if (!pin) { toast('Digite o PIN!'); return; }
  db.collection('config').doc('funcionarios').get().then(snap => {
    let lista = [];
    if (snap.exists) {
      const d = snap.data();
      lista = d.funcionarios || (d.nomes ? d.nomes.map(n => ({nome:n, pin:''})) : []);
    }
    const func = lista.find(f => f.nome === nome);
    if (func && (func.pin === pin || func.pin === '')) {
      entrar(nome);
    } else {
      toast('PIN incorreto!');
      const inp = document.getElementById('pin-input');
      if (inp) { inp.value = ''; inp.focus(); }
    }
  }).catch(() => toast('Erro de conexão!'));
}

// ════════════════════════════════
// UTILS
// ════════════════════════════════
function today() { return new Date().toISOString().split('T')[0]; }
function fmtDate(d) {
  if (!d) return '';
  const [y,m,dia] = d.split('-');
  return `${dia}/${m}/${y}`;
}
function fmtDateFull() {
  return new Date().toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' });
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ════════════════════════════════
// AUTH
// ════════════════════════════════
function entrar(nome) {
  currentUser = nome;
  sessionStorage.setItem('manut_equipe_nome', nome);
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').classList.add('visible');
  document.getElementById('header-date').textContent = fmtDateFull();
  document.getElementById('header-user').textContent = nome;
  activeStatus = '';   // abre em "Todas": hoje + o que ficou atrasado
  initListeners();
  initApont();
  render();
  renderMeuDia();
}

function logout() {
  pararApont();
  currentUser = '';
  sessionStorage.removeItem('manut_equipe_nome');
  document.getElementById('app').classList.remove('visible');
  document.getElementById('login-screen').style.display = 'flex';
  carregarFuncs();
}

// ════════════════════════════════
// FILTROS
// ════════════════════════════════
let activeStatus = '';

// Tocar de novo no filtro ativo volta para "Todas" — evita ele ficar preso
// numa lista vazia sem saber como sair.
function setFiltro(status) {
  activeStatus = (activeStatus === status) ? '' : status;
  render();
}

// ════════════════════════════════
// RENDER
// ════════════════════════════════
function render() {
  const hoje = today();

  // Sem seletor de data: a tela é sempre "o que ele tem para fazer agora" —
  // as de hoje mais o que ficou atrasado em dia anterior e ainda não foi concluído.
  // Tarefa futura não aparece: só polui quem está em campo.
  const minhas = tasks.filter(t => t.resp === currentUser)
                      .filter(t => t.data === hoje || (t.data < hoje && t.status !== 'concluida'));

  const pend   = minhas.filter(t => t.status === 'pendente').length;
  const and    = minhas.filter(t => t.status === 'andamento').length;
  const conc   = minhas.filter(t => t.status === 'concluida').length;

  const cEl = document.getElementById('counters-bar');
  const on  = v => activeStatus === v ? ' on' : '';
  if (cEl) cEl.innerHTML = `
    <button class="cnt c-total${on('')}"          onclick="setFiltro('')">
      <div class="num">${minhas.length}</div><div class="lbl">Todas</div></button>
    <button class="cnt c-pend${on('pendente')}"   onclick="setFiltro('pendente')">
      <div class="num">${pend}</div><div class="lbl">Pendentes</div></button>
    <button class="cnt c-and${on('andamento')}"   onclick="setFiltro('andamento')">
      <div class="num">${and}</div><div class="lbl">Andamento</div></button>
    <button class="cnt c-conc${on('concluida')}"  onclick="setFiltro('concluida')">
      <div class="num">${conc}</div><div class="lbl">Concluídas</div></button>
  `;

  let list = minhas.filter(t => !activeStatus || t.status === activeStatus);
  // Ordena: atrasadas e pendentes primeiro, depois por data e prioridade
  list.sort((a,b) => {
    const today_ = today();
    const aAtras = a.data < today_ && a.status !== 'concluida' ? -1 : 0;
    const bAtras = b.data < today_ && b.status !== 'concluida' ? -1 : 0;
    if (aAtras !== bAtras) return aAtras - bAtras;
    return statusOrder(a.status) - statusOrder(b.status)
        || a.data.localeCompare(b.data)
        || prioOrder(a.prio) - prioOrder(b.prio);
  });

  const el = document.getElementById('task-list');
  if (!el) return;
  if (!list.length) {
    const msg = activeStatus
      ? { pendente:'Nenhuma tarefa pendente.', andamento:'Nenhuma tarefa em andamento.',
          concluida:'Nenhuma tarefa concluída ainda.' }[activeStatus]
      : 'Nenhuma tarefa para hoje.';
    el.innerHTML = `<div class="empty"><div class="icon">✅</div><p>${msg}</p></div>`;
    return;
  }
  el.innerHTML = list.map(cardHTML).join('');
}

function statusOrder(s) { return { pendente:0, andamento:1, concluida:2 }[s] ?? 0; }
function prioOrder(p)   { return { alta:0, media:1, baixa:2 }[p] ?? 1; }

// ════════════════════════════════
// CARD HTML
// ════════════════════════════════
function cardHTML(t) {
  const d = today();
  // Sem ícone de calendário: a cor do texto já diz se é hoje, futura ou atrasada.
  // O da atrasada fica, porque é o único aviso de verdade no card.
  let dateCls = 'date-futura', dateLabel = fmtDate(t.data);
  if (t.data === d)  { dateCls = 'date-hoje';     dateLabel = 'Hoje'; }
  else if (t.data<d) { dateCls = 'date-atrasada'; dateLabel = '' + fmtDate(t.data); }

  const statusTagCls = { pendente:'tag-pend', andamento:'tag-and', concluida:'tag-conc' }[t.status] || '';
  const statusLabel  = { pendente:'Pendente', andamento:'Andamento', concluida:'Concluída' }[t.status] || '';

  const obsHtml      = t.obs     ? `<div class="card-obs-saved"><strong>Obs:</strong> ${esc(t.obs)}</div>` : '';
  const dataExecHtml = t.dataExec? `<div class="card-exec-date">Executado em: ${fmtDate(t.dataExec)}</div>` : '';

  const fotosHtml = (t.fotos && t.fotos.length)
    ? `<div class="card-fotos">${t.fotos.map((f,i) =>
        `<img class="card-foto-thumb" src="${f}" onclick="openLightbox('${t.id}',${i})" />`
      ).join('')}</div>` : '';

  const sBtn = (val, icon, label) =>
    `<button class="status-btn ${t.status===val?'active-'+val.replace('andamento','and').replace('pendente','pend').replace('concluida','conc'):''}" onclick="setStatus('${t.id}','${val}')">
       <span class="s-icon">${icon}</span>${label}
     </button>`;

  const pending = fotosPendentes[t.id] || [];
  const pendPrev = `<div class="fotos-preview" id="prev-${t.id}">${pending.map((f,i) => `
    <div class="prev-wrap">
      <img class="prev-thumb" src="${f}" />
      <button class="prev-del" onclick="removePendFoto('${t.id}',${i})">✕</button>
    </div>`).join('')}</div>`;

  return `
    <div class="task-card" data-prio="${t.prio}" id="card-${t.id}">
      <div class="card-top">
        <div class="card-row1">
          <div class="card-tipo">${esc(t.tipo)}</div>
          <div class="card-date ${dateCls}">${dateLabel}</div>
        </div>
        <div class="card-tags">
          <span class="tag tag-apto">${esc(t.apto)}</span>
          ${t.resp ? `<span class="tag tag-resp">${esc(t.resp)}</span>` : ''}
          <span class="tag ${statusTagCls}">${statusLabel}</span>
        </div>
        ${t.desc ? `<div class="card-desc">${esc(t.desc)}</div>` : ''}
      </div>
      ${obsHtml}${dataExecHtml}${fotosHtml}
      <button class="action-toggle" id="toggle-${t.id}" onclick="togglePanel('${t.id}')">
        <span>Atualizar tarefa</span>
        <span class="arrow">▼</span>
      </button>
      <div class="action-panel" id="panel-${t.id}">
        <div>
          <div class="field-label">Status da tarefa</div>
          <div class="status-btns">
            ${sBtn('pendente',  '', 'Pendente')}
            ${sBtn('andamento', '', 'Em andamento')}
            ${sBtn('concluida', '', 'Concluída')}
          </div>
        </div>
        <div>
          <div class="field-label">Data de execução</div>
          <input type="date" class="field-input" value="${t.dataExec || ''}"
            onchange="setDataExec('${t.id}', this.value)" />
        </div>
        <div>
          <div class="field-label">Observação</div>
          <textarea class="field-input" id="obs-${t.id}"
            placeholder="Materiais usados, pendências, detalhes…">${esc(t.obs)}</textarea>
        </div>
        <div>
          <div class="field-label">Fotos</div>
          <label class="foto-label" for="foto-${t.id}">
            <span>Tirar foto ou escolher da galeria</span>
          </label>
          <input type="file" accept="image/*" capture="environment" multiple
            id="foto-${t.id}" onchange="previewFotos('${t.id}', this)" />
          ${pendPrev}
        </div>
        <button class="btn-save" onclick="salvar('${t.id}')">Salvar</button>
      </div>
    </div>
  `;
}

// ════════════════════════════════
// AÇÕES
// ════════════════════════════════
function togglePanel(id) {
  const panel  = document.getElementById('panel-' + id);
  const toggle = document.getElementById('toggle-' + id);
  panel.classList.toggle('open');
  toggle.classList.toggle('open');
}

async function setStatus(id, status) {
  await dbUpdate(id, { status });
  // Reabre o painel após re-render (via onSnapshot)
  requestAnimationFrame(() => {
    const panel  = document.getElementById('panel-' + id);
    const toggle = document.getElementById('toggle-' + id);
    if (panel) { panel.classList.add('open'); toggle.classList.add('open'); }
  });
  toast('Status atualizado!');
}

async function setDataExec(id, data) {
  await dbUpdate(id, { dataExec: data });
  toast('Data de execução salva!');
}

function previewFotos(id, input) {
  if (!fotosPendentes[id]) fotosPendentes[id] = [];
  const files = Array.from(input.files);
  let loaded = 0;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      fotosPendentes[id].push(e.target.result);
      if (++loaded === files.length) updatePreview(id);
    };
    reader.readAsDataURL(file);
  });
  input.value = '';
}

function updatePreview(id) {
  const wrap = document.getElementById('prev-' + id);
  if (!wrap) return;
  const pending = fotosPendentes[id] || [];
  wrap.innerHTML = pending.map((f,i) => `
    <div class="prev-wrap">
      <img class="prev-thumb" src="${f}" />
      <button class="prev-del" onclick="removePendFoto('${id}',${i})">✕</button>
    </div>`).join('');
}

function removePendFoto(id, idx) {
  if (fotosPendentes[id]) { fotosPendentes[id].splice(idx, 1); updatePreview(id); }
}

async function salvar(id) {
  const obs    = document.getElementById('obs-' + id)?.value.trim() || '';
  const novFot = fotosPendentes[id] || [];
  const t      = tasks.find(t => t.id === id);
  if (!t) return;

  const fotos = [...(t.fotos || []), ...novFot];
  await dbUpdate(id, { obs, fotos });
  delete fotosPendentes[id];
  toast('Salvo com sucesso!');
}

// ════════════════════════════════
// LIGHTBOX
// ════════════════════════════════
function openLightbox(taskId, idx) {
  const t = tasks.find(t => t.id === taskId);
  if (!t || !t.fotos || !t.fotos[idx]) return;
  document.getElementById('lb-img').src = t.fotos[idx];
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lb-img').src = '';
}

// ════════════════════════════════
// MEU DIA — APONTAMENTO DE HORAS
// ════════════════════════════════
// Turno = 4h. Horas externas saem primeiro (rateadas por hora, fora das Angelicas);
// o resto se divide entre as unidades marcadas, proporcional ao nº de apartamentos.
const UNIDADES = [
  { id:'A1', nome:'Angelica 1', aptos:6  },
  { id:'A2', nome:'Angelica 2', aptos:8  },
  { id:'A3', nome:'Angelica 3', aptos:16 },
  { id:'A4', nome:'Angelica 4', aptos:12 },
  { id:'A5', nome:'Angelica 5', aptos:4  },
];
const APTOS       = Object.fromEntries(UNIDADES.map(u => [u.id, u.aptos]));
const NOMES_UN    = Object.fromEntries(UNIDADES.map(u => [u.id, u.nome]));
const HORAS_TURNO = 4;
const DIAS_RETRO  = 7;    // colaborador corrige até 7 dias atrás
const INICIO_PADRAO = '2026-08-01';

let meusApts    = [];
let inicioApont = INICIO_PADRAO;
let bloqueios   = {};     // { sempre:[...], '2026-08':[...] } — quem o gestor liberou de apontar
let diaEdit     = null;   // {data, manha, tarde}
let apontOn     = false;

let unsubApont = null, unsubCfgApont = null;

function initApont() {
  if (apontOn) return;
  apontOn = true;
  // Filtra só por func: range de data junto exigiria índice composto no Firestore.
  unsubApont = db.collection('apontamentos').where('func', '==', currentUser).onSnapshot(snap => {
    meusApts = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    renderMeuDia();
  });
  unsubCfgApont = db.collection('config').doc('apontamento').onSnapshot(snap => {
    const d = snap.exists ? snap.data() : {};
    if (d.inicio) inicioApont = d.inicio;
    bloqueios = d.bloqueios || {};
    renderMeuDia();
  });
}

function pararApont() {
  if (unsubApont)    unsubApont();
  if (unsubCfgApont) unsubCfgApont();
  unsubApont = unsubCfgApont = null;
  apontOn  = false;
  meusApts = [];
  diaEdit  = null;
}

// ── Datas ──
function hojeISO() {
  return new Date().toLocaleDateString('sv-SE', { timeZone: 'America/Sao_Paulo' });
}
function addDias(iso, n) {
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m-1, d + n));
  return dt.toISOString().slice(0,10);
}
function ehUtilISO(iso) {
  const [y,m,d] = iso.split('-').map(Number);
  const w = new Date(Date.UTC(y, m-1, d)).getUTCDay();
  return w >= 1 && w <= 5;
}
function fmtDiaSem(iso) {
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  const sem = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][dt.getUTCDay()];
  return `${sem}, ${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}`;
}

// Liberado de apontar (decidido pelo gestor): sempre, ou só naquele mês.
function liberadoNoMes(mes) {
  return (bloqueios.sempre || []).includes(currentUser) ? 'sempre'
       : (bloqueios[mes]   || []).includes(currentUser) ? 'mes' : '';
}

// Dias úteis sem lançamento, do início do apontamento até ontem (limite de 60 dias).
// Dia de mês liberado não conta como pendência.
function diasPendentes() {
  const hoje = hojeISO();
  const limite = addDias(hoje, -60);
  let d = inicioApont > limite ? inicioApont : limite;
  const out = [];
  while (d < hoje) {
    if (ehUtilISO(d) && !liberadoNoMes(d.slice(0,7)) && !meusApts.some(a => a.data === d)) out.push(d);
    d = addDias(d, 1);
  }
  return out;
}

function turnoVazio() { return { status:'trabalho', unidades:[], extHoras:0, extDest:'' }; }

function carregarDia(data) {
  const doc = meusApts.find(a => a.data === data);
  diaEdit = {
    data,
    manha: doc && doc.manha ? { ...turnoVazio(), ...doc.manha, unidades:[...(doc.manha.unidades||[])] } : turnoVazio(),
    tarde: doc && doc.tarde ? { ...turnoVazio(), ...doc.tarde, unidades:[...(doc.tarde.unidades||[])] } : turnoVazio(),
  };
}

function ratearTurno(t) {
  const out = { unidades:{}, externo:{}, horas:0, incompleto:false };
  if (!t || t.status !== 'trabalho') return out;
  const ext  = Math.max(0, Math.min(HORAS_TURNO, Number(t.extHoras) || 0));
  const rest = HORAS_TURNO - ext;
  if (ext > 0) { out.externo[(t.extDest||'').trim() || 'Externo'] = ext; out.horas += ext; }
  const sel = (t.unidades || []).filter(u => APTOS[u]);
  if (rest > 0) {
    if (!sel.length) out.incompleto = true;
    else {
      const peso = sel.reduce((s,u) => s + APTOS[u], 0);
      sel.forEach(u => { const hs = rest * APTOS[u] / peso; out.unidades[u] = hs; out.horas += hs; });
    }
  }
  return out;
}
function fmtH(v) {
  return (Math.round((v||0)*100)/100).toLocaleString('pt-BR', { maximumFractionDigits:2 }) + 'h';
}

// ── Abas ──
function showView(btn) {
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + btn.dataset.view).classList.add('active');
  if (btn.dataset.view === 'meudia') renderMeuDia();
}

// ── Render ──
function renderMeuDia() {
  const el = document.getElementById('meudia');
  if (!el || !currentUser) return;

  const pend  = diasPendentes();
  const hoje  = hojeISO();
  const badge = document.getElementById('badge-md');
  if (badge) {
    badge.textContent = pend.length || '';
    badge.classList.toggle('on', pend.length > 0);
  }

  // Liberado pelo gestor: nada a lançar, nada de trava.
  // Só vale se não houver pendência de mês anterior — liberar agosto não perdoa julho.
  const lib = liberadoNoMes(hoje.slice(0,7));
  if (lib && !pend.length) {
    const mesNome = new Date(Date.UTC(+hoje.slice(0,4), +hoje.slice(5,7) - 1, 1))
      .toLocaleDateString('pt-BR', { month:'long', year:'numeric', timeZone:'UTC' });
    el.innerHTML = `
      <div class="md-card" style="text-align:center;padding:30px 18px">
        <div style="font-size:2.6rem;margin-bottom:10px">🔕</div>
        <div style="font-size:1rem;font-weight:800;margin-bottom:6px">Sem apontamento por enquanto</div>
        <div style="font-size:.88rem;color:var(--muted);line-height:1.5">
          ${lib === 'sempre'
            ? 'Você não precisa lançar horas neste app.'
            : `Você está liberado de lançar horas em <b>${mesNome}</b>.`}<br>
          Qualquer dúvida, fale com o gestor.
        </div>
      </div>`;
    return;
  }

  // Com atraso, o alvo é sempre o dia mais antigo em aberto — hoje fica bloqueado.
  const alvo = pend.length ? pend[0] : hoje;
  if (!diaEdit || (pend.length && diaEdit.data !== alvo) ||
      (!pend.length && diaEdit.data > hoje)) carregarDia(alvo);
  if (!diaEdit) carregarDia(alvo);

  let topo = '';
  if (pend.length) {
    topo = `<div class="md-trava">
        Você tem <b>${pend.length} dia(s)</b> sem apontamento.
        <div class="lista">${pend.map(fmtDiaSem).join(' · ')}</div>
        <div style="font-weight:600;margin-top:8px;font-size:.8rem">
          Preencha o mais antigo abaixo para liberar o lançamento de hoje.</div>
        ${pend.length > 1 ? `<button class="btn-save" style="background:#64748b;margin-top:10px"
            onclick="mdFolgaLote()">Foram todos folga/férias — marcar tudo</button>` : ''}
      </div>`;
  } else {
    topo = `<div class="md-ok">Apontamento em dia</div>`;
  }

  const hist = meusApts.slice().sort((a,b) => b.data.localeCompare(a.data)).slice(0,7);
  const histHTML = hist.length ? `
    <div class="md-card md-hist">
      <div style="font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;
                  letter-spacing:.4px;margin-bottom:8px">Últimos lançamentos</div>
      ${hist.map(d => `<div class="md-hist-row">
          <span class="dt">${fmtDiaSem(d.data)}</span>
          <span class="de">${resumoDia(d)}</span>
        </div>`).join('')}
    </div>` : '';

  const seletor = !pend.length ? `
    <div class="md-data">
      <div>
        <h3>${diaEdit.data === hoje ? 'Hoje' : fmtDiaSem(diaEdit.data)}</h3>
        <div class="sub">${diaEdit.data === hoje ? fmtDiaSem(hoje) : 'Correção de dia anterior'}</div>
      </div>
      <input type="date" class="date-filter" value="${diaEdit.data}"
        min="${addDias(hoje, -DIAS_RETRO)}" max="${hoje}" onchange="mdTrocarData(this.value)">
    </div>` : `
    <div class="md-data">
      <div>
        <h3>${fmtDiaSem(diaEdit.data)}</h3>
        <div class="sub">Dia em aberto</div>
      </div>
    </div>`;

  el.innerHTML = `
    ${topo}
    <div class="md-card">
      ${seletor}
      ${mdTurnoHTML('manha', 'Manhã', '08:00 – 12:00')}
      <div style="height:12px"></div>
      ${mdTurnoHTML('tarde', 'Tarde', '13:00 – 17:00')}
      <button class="btn-save" style="margin-top:14px" onclick="mdSalvar()">Salvar o dia</button>
    </div>
    ${histHTML}`;
}

function resumoDia(d) {
  const partes = [];
  [['manha','M'],['tarde','T']].forEach(([k,lbl]) => {
    const t = d[k];
    if (!t) return;
    if (t.status === 'folga') { partes.push(`${lbl}: folga`); return; }
    if (t.status === 'falta') { partes.push(`${lbl}: falta`); return; }
    const r = ratearTurno(t);
    const txt = Object.keys(r.unidades).map(u => u).join('+')
      + (Object.keys(r.externo).length ? (Object.keys(r.unidades).length ? '+' : '') + 'Ext' : '');
    partes.push(`${lbl}: ${txt || '—'}`);
  });
  return partes.join(' · ') || '—';
}

function mdTurnoHTML(key, label, faixa) {
  const t = diaEdit[key];
  const trab  = t.status === 'trabalho';
  const todas = UNIDADES.every(u => t.unidades.includes(u.id));
  const r = ratearTurno(t);

  let detalhe;
  if (!trab) {
    detalhe = t.status === 'folga' ? 'Folga — não entra no rateio.' : 'Falta — não entra no rateio.';
  } else if (r.incompleto) {
    detalhe = `<span class="erro">Faltam ${fmtH(HORAS_TURNO - (Number(t.extHoras)||0))}</span> — marque uma Angelica ou aumente as horas externas.`;
  } else {
    const its = Object.entries(r.unidades).map(([u,v]) => `${NOMES_UN[u]}: <b>${fmtH(v)}</b>`)
      .concat(Object.entries(r.externo).map(([e,v]) => `${esc(e)}: <b>${fmtH(v)}</b>`));
    detalhe = its.join(' · ') || 'Nada marcado ainda.';
  }

  return `
  <div class="turno-box">
    <div class="turno-head"><strong>${label}</strong><small>${faixa} · ${HORAS_TURNO}h</small></div>
    <div class="chips" style="margin-bottom:10px">
      <button class="chip ${trab?'on':''}" onclick="mdStatus('${key}','trabalho')">Trabalhei</button>
      <button class="chip ${t.status==='folga'?'on-cinza':''}" onclick="mdStatus('${key}','folga')">Folga</button>
      <button class="chip ${t.status==='falta'?'on-cinza':''}" onclick="mdStatus('${key}','falta')">Falta</button>
    </div>
    ${trab ? `
      <div class="chips">
        ${UNIDADES.map(u => `<button class="chip ${t.unidades.includes(u.id)?'on':''}"
            onclick="mdUnidade('${key}','${u.id}')">${u.nome}</button>`).join('')}
        <button class="chip ${todas?'on':''}" onclick="mdTodas('${key}')">Todas</button>
        <button class="chip ${(Number(t.extHoras)||0)>0?'on-esc':''}" onclick="mdExt('${key}')">Externo</button>
      </div>
      <div class="ext-box ${(Number(t.extHoras)||0)>0?'open':''}">
        <input class="h" type="number" step="0.5" min="0" max="${HORAS_TURNO}" value="${t.extHoras||''}"
          placeholder="h" onchange="mdExtHoras('${key}', this.value)">
        <input class="d" type="text" value="${esc(t.extDest)}" placeholder="Onde? ex: Obra academia"
          onchange="mdExtDest('${key}', this.value)">
      </div>` : ''}
    <div class="resumo-turno">${detalhe}</div>
  </div>`;
}

// ── Ações ──
function mdTrocarData(data) { carregarDia(data); renderMeuDia(); }
function mdStatus(key, st) {
  diaEdit[key].status = st;
  if (st !== 'trabalho') { diaEdit[key].unidades = []; diaEdit[key].extHoras = 0; diaEdit[key].extDest = ''; }
  renderMeuDia();
}
function mdUnidade(key, id) {
  const arr = diaEdit[key].unidades;
  const i = arr.indexOf(id);
  if (i >= 0) arr.splice(i,1); else arr.push(id);
  renderMeuDia();
}
function mdTodas(key) {
  const t = diaEdit[key];
  t.unidades = UNIDADES.every(u => t.unidades.includes(u.id)) ? [] : UNIDADES.map(u => u.id);
  renderMeuDia();
}
function mdExt(key) {
  const t = diaEdit[key];
  if ((Number(t.extHoras)||0) > 0) { t.extHoras = 0; t.extDest = ''; }
  else { t.extHoras = HORAS_TURNO; t.unidades = []; }
  renderMeuDia();
}
function mdExtHoras(key, v) {
  diaEdit[key].extHoras = Math.max(0, Math.min(HORAS_TURNO, Number(v)||0));
  renderMeuDia();
}
function mdExtDest(key, v) { diaEdit[key].extDest = v; renderMeuDia(); }

function validarTurno(t, label) {
  if (t.status !== 'trabalho') return null;
  const ext = Number(t.extHoras) || 0;
  if (ext > 0 && !(t.extDest||'').trim()) return `${label}: informe onde foi o trabalho externo.`;
  if (ext < HORAS_TURNO && !(t.unidades||[]).length)
    return `${label}: faltam ${fmtH(HORAS_TURNO - ext)} — marque uma Angelica.`;
  return null;
}

function docIdApont(data, nome) {
  const s = String(nome||'').normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase();
  return `${data}_${s}`;
}

async function mdSalvar() {
  if (!diaEdit) return;
  const e1 = validarTurno(diaEdit.manha, 'Manhã');
  const e2 = validarTurno(diaEdit.tarde, 'Tarde');
  if (e1 || e2) { toast('' + (e1 || e2)); return; }

  await db.collection('apontamentos').doc(docIdApont(diaEdit.data, currentUser)).set({
    data: diaEdit.data,
    anoMes: diaEdit.data.slice(0,7),
    func: currentUser,
    manha: diaEdit.manha,
    tarde: diaEdit.tarde,
    editadoPor: 'equipe',
    atualizadoEm: new Date().toISOString(),
  }, { merge: true });

  diaEdit = null;
  toast('Dia lançado!');
}

async function mdFolgaLote() {
  const pend = diasPendentes();
  if (!pend.length) return;
  if (!confirm(`Marcar folga nos ${pend.length} dia(s) em aberto?\n${pend.map(fmtDiaSem).join('\n')}`)) return;
  const folga = { status:'folga', unidades:[], extHoras:0, extDest:'' };
  const lote = db.batch();
  pend.forEach(data => {
    lote.set(db.collection('apontamentos').doc(docIdApont(data, currentUser)), {
      data, anoMes: data.slice(0,7), func: currentUser,
      manha: { ...folga }, tarde: { ...folga },
      editadoPor: 'equipe', atualizadoEm: new Date().toISOString(),
    }, { merge: true });
  });
  await lote.commit();
  diaEdit = null;
  toast('Dias marcados como folga.');
}

// ════════════════════════════════
// INSTALAÇÃO NA TELA INICIAL
// ════════════════════════════════
// Sem service worker o Android trata o site como atalho comum e abre dentro do Chrome,
// com a barra de endereço por cima. Registrando, o app instala de verdade e abre limpo.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW não registrado:', e));
  });
}

let promptInstalar = null;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  promptInstalar = e;
  const b = document.getElementById('btn-instalar');
  if (b) b.style.display = 'flex';
});

window.addEventListener('appinstalled', () => {
  promptInstalar = null;
  const b = document.getElementById('btn-instalar');
  if (b) b.style.display = 'none';
});

async function instalarApp() {
  if (!promptInstalar) return;
  promptInstalar.prompt();
  const { outcome } = await promptInstalar.userChoice;
  promptInstalar = null;
  document.getElementById('btn-instalar').style.display = 'none';
  if (outcome === 'accepted') toast('App instalado!');
}

// ════════════════════════════════
// INIT
// ════════════════════════════════

(function init() {
    // Sessao anonima: esta pagina nao carrega credencial nenhuma. O que ela pode
    // fazer e decidido pelas regras do Firestore (ler/criar/atualizar; nunca
    // apagar), nao por qual conta ela finge ser. Ate 2026-08-16 a senha da conta
    // da equipe vinha escrita aqui, numa pagina publica.
    firebase.auth().signInAnonymously().then(() => {
    const savedName = sessionStorage.getItem('manut_equipe_nome');
    if (savedName) {
      entrar(savedName);
    } else {
      carregarFuncs();
    }
  }).catch(e => console.error('Falha no acesso ao servidor:', e));
})();
</script>

<script>
// No celular as faixas de filtro rolam de lado em vez de quebrar em varias
// linhas. Sem sinal nenhum o dedo nao descobre que tem mais coisa fora da tela,
// entao marca com .rola-lateral (degrade na borda direita) so quando sobra
// conteudo — se coubesse tudo, o degrade apareceria por nada.
(function marcarRolagemLateral() {
  var faixas = document.querySelectorAll(
    'nav, .abas, .top-row, .linha-filtros, .resumo, .contas, .filtros, .filtros-conta,' +
    '.risco, .stats, .limp-actions, .limp-stats-bar, .tabs, nav.tabs');
  if (!faixas.length) return;
  var aplicar = function () {
    faixas.forEach(function (f) {
      // So marca quem REALMENTE rola. No Contratos quem rola e o <nav>, e o
      // .abas de dentro so e largo: com o degrade no .abas ele andaria junto
      // com o conteudo em vez de ficar parado na borda da tela.
      var ovx = getComputedStyle(f).overflowX;
      var rolavel = (ovx === 'auto' || ovx === 'scroll') && f.scrollWidth > f.clientWidth + 2;
      f.classList.toggle('rola-lateral', rolavel);
    });
  };
  aplicar();
  window.addEventListener('resize', aplicar);
  window.addEventListener('orientationchange', aplicar);
  window.addEventListener('load', aplicar);
  if (window.ResizeObserver) faixas.forEach(function (f) { new ResizeObserver(aplicar).observe(f); });
  // A lista chega por fetch: sem reavaliar depois, um filtro criado por JS
  // nao ganharia o degrade. MutationObserver cobre qualquer modulo, sem
  // precisar achar o ponto exato onde cada um monta a barra.
  if (window.MutationObserver) {
    var t = null;
    new MutationObserver(function () {
      clearTimeout(t); t = setTimeout(aplicar, 60);
    }).observe(document.body, { childList: true, subtree: true });
  }
})();
</script>
